name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle wrapper
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: wallhack-mod
          path: build/libs/*.jar
